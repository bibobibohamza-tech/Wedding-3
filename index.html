<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دعوة زفاف | محمد &amp; خلود</title>
  
  <!-- إعدادات المشاركة الفاخرة على واتساب وفيسبوك -->
  <meta property="og:title" content="دعوة زفاف | محمد &amp; خلود">
  <meta property="og:description" content="يتشرف الأستاذ / محسن خليل والعميد / حمزه الدخميسى بدعوتكم لحفل الزفاف - 5 نوفمبر 2026">
  <meta property="og:type" content="website">

  <!-- الخطوط العربية والأيقونات وتأثيرات الكونفيتي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-cream: #090a0d;
      --paper-cream: #0e121a;
      --gold-primary: #e6ca85;
      --gold-light: #fef4ce;
      --gold-dark: #b89344;
      --gold-bronze: #8c6a28;
      --text-dark: #f0ede6;
      --text-muted: #b9bec9;
      --wax-red: #8f1d2c;
      --wax-shadow: rgba(87, 8, 17, 0.65);
      --border-gold: rgba(230, 202, 133, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(143, 29, 44, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 15% 75%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
      color: var(--text-dark);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* تساقط البتلات الذهبية الهادئة */
    .petals-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -10%;
      background: radial-gradient(ellipse at center, rgba(243, 229, 171, 0.85) 0%, rgba(201, 160, 80, 0.3) 70%, transparent 100%);
      border-radius: 50% 0 50% 50%;
      animation: fallDown linear infinite;
      filter: blur(0.3px);
    }
    @keyframes fallDown {
      0% { transform: translateY(-50px) rotate(0deg) scale(0.8); opacity: 0; }
      15% { opacity: 0.85; }
      90% { opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(540deg) scale(1.1); opacity: 0; }
    }

    /* زر الموسيقى العائم */
    .floating-audio-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 999;
      background: rgba(14, 18, 26, 0.85);
      border: 1px solid var(--border-gold);
      color: var(--gold-primary);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    .floating-audio-btn:hover {
      transform: scale(1.08);
      border-color: var(--gold-light);
    }
    .floating-audio-btn.playing i {
      animation: pulseMusic 1.2s infinite ease-in-out;
    }
    @keyframes pulseMusic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.22); color: var(--gold-light); }
    }

    /* المشهد الأول: الظرف الملكي والختم الشمعي */
    #envelope-screen {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: radial-gradient(circle at center, #171d2b 0%, #080a0e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1), transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      padding: 20px;
    }
    #envelope-screen.opened-hide {
      opacity: 0;
      transform: scale(1.15);
      pointer-events: none;
    }

    .top-royal-banner {
      text-align: center;
      margin-bottom: 25px;
      animation: fadeInDown 1.2s ease;
    }
    .monogram-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      position: relative;
      background: rgba(15, 20, 30, 0.8);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
      margin-bottom: 12px;
    }
    .monogram-badge::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px dashed var(--gold-light);
      border-radius: 50%;
    }
    .monogram-badge span {
      font-family: 'Aref Ruqaa', serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--gold-light);
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .royal-date-tag {
      font-family: 'Cinzel Decorative', 'Amiri', serif;
      letter-spacing: 3px;
      color: var(--gold-primary);
      font-size: 1.05rem;
      border-top: 1px solid var(--border-gold);
      border-bottom: 1px solid var(--border-gold);
      padding: 4px 18px;
      display: inline-block;
    }

    /* مجسم الظرف 3D */
    .envelope-wrapper {
      position: relative;
      width: 350px;
      height: 235px;
      background: #141a24;
      border-radius: 8px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px rgba(212, 175, 55, 0.15);
      perspective: 1200px;
      cursor: pointer;
      transition: transform 0.4s ease;
    }
    @media (max-width: 400px) {
      .envelope-wrapper { width: 310px; height: 210px; }
    }
    .envelope-wrapper:hover {
      transform: translateY(-5px);
    }
    .envelope-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: #19202c;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      overflow: hidden;
    }
    .envelope-box::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(35deg, #10151f 0%, #1c2432 100%);
      clip-path: polygon(0% 100%, 50% 45%, 100% 100%);
      z-index: 5;
      border-top: 1px solid rgba(212, 175, 55, 0.25);
    }
    .envelope-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, #131822 0%, #171f2c 100%);
      clip-path: polygon(0 0, 0 100%, 50% 50%);
      z-index: 4;
      border-right: 1px solid rgba(212, 175, 55, 0.2);
    }
    .envelope-right-fold {
      position: absolute;
      inset: 0;
      background: linear-gradient(to left, #131822 0%, #171f2c 100%);
      clip-path: polygon(100% 0, 100% 100%, 50% 50%);
      z-index: 4;
      border-left: 1px solid rgba(212, 175, 55, 0.2);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(180deg, #222c3d 0%, #171e2b 100%);
      clip-path: polygon(0 0, 100% 0, 50% 53%);
      transform-origin: top center;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 6;
      border-bottom: 1px solid var(--gold-primary);
    }
    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 2;
    }

    .mini-card-inside {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      bottom: 15px;
      background: #0d1117;
      border: 1px solid var(--gold-primary);
      border-radius: 5px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) 0.3s;
      padding: 10px;
      text-align: center;
    }
    .envelope-wrapper.open .mini-card-inside {
      transform: translateY(-90px) scale(1.05);
    }
    .mini-card-inside h4 {
      font-family: 'Aref Ruqaa', serif;
      color: var(--gold-light);
      font-size: 1.35rem;
    }
    .mini-card-inside p {
      font-size: 0.82rem;
      color: var(--gold-primary);
    }

    /* الختم الشمعي */
    .wax-seal {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      background: radial-gradient(circle at 35% 35%, #b4293c, #801321 60%, #470810 100%);
      border-radius: 50%;
      box-shadow: 0 6px 18px var(--wax-shadow), inset 0 2px 4px rgba(255,255,255,0.3);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .wax-seal::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1.5px dashed rgba(247, 218, 148, 0.5);
    }
    .wax-seal span {
      font-family: 'Aref Ruqaa', serif;
      color: #ffd88a;
      font-size: 1.35rem;
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      user-select: none;
    }
    .envelope-wrapper:hover .wax-seal {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 8px 24px rgba(180, 41, 60, 0.8);
    }
    .envelope-wrapper.open .wax-seal {
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .open-prompt-text {
      margin-top: 25px;
      color: var(--gold-light);
      font-size: 1.05rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: pulseText 1.8s infinite;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.65; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* صفحة الدعوة الرئيسية */
    #main-invitation {
      max-width: 760px;
      margin: 0 auto;
      padding: 50px 20px 80px 20px;
      position: relative;
      opacity: 0;
      transform: translateY(40px);
      transition: all 1.2s ease 0.3s;
    }
    #main-invitation.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .royal-card {
      background: linear-gradient(145deg, #10141d 0%, #0a0d13 100%);
      border: 1.5px solid var(--border-gold);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 20px rgba(212, 175, 55, 0.05);
      position: relative;
      padding: 45px 30px;
      text-align: center;
      overflow: hidden;
    }
    .royal-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      pointer-events: none;
    }
    .corner-decor {
      position: absolute;
      width: 45px;
      height: 45px;
      border-color: var(--gold-primary);
      pointer-events: none;
    }
    .top-left { top: 14px; left: 14px; border-top: 2px solid; border-left: 2px solid; }
    .top-right { top: 14px; right: 14px; border-top: 2px solid; border-right: 2px solid; }
    .bottom-left { bottom: 14px; left: 14px; border-bottom: 2px solid; border-left: 2px solid; }
    .bottom-right { bottom: 14px; right: 14px; border-bottom: 2px solid; border-right: 2px solid; }

    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 1.5rem;
      color: var(--gold-light);
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .quran-ayah {
      font-family: 'Amiri', serif;
      font-style: italic;
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 580px;
      margin: 0 auto 30px;
      line-height: 1.9;
      position: relative;
      padding: 0 20px;
    }
    .divider-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 25px 0;
      color: var(--gold-primary);
    }
    .divider-ornament .line {
      height: 1px;
      width: 80px;
      background: linear-gradient(to right, transparent, var(--gold-primary), transparent);
    }

    .families-section {
      margin: 25px 0;
    }
    .families-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 1.25rem;
      color: var(--gold-primary);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .family-names-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }
    .family-name-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 22px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .couples-hero {
      margin: 35px 0;
      position: relative;
    }
    .couples-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 3.5rem;
      line-height: 1.4;
      background: linear-gradient(135deg, #fff2cb 0%, #dfb455 50%, #997424 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
      margin-bottom: 5px;
    }
    .couples-ampersand {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      color: var(--wax-red);
      display: inline-block;
      margin: 0 10px;
      -webkit-text-fill-color: initial;
    }

    .event-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin: 35px 0 25px;
    }
    .detail-card {
      background: rgba(18, 23, 33, 0.7);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 22px 18px;
      transition: transform 0.3s ease;
    }
    .detail-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-light);
    }
    .detail-card i {
      font-size: 1.8rem;
      color: var(--gold-primary);
      margin-bottom: 12px;
    }
    .detail-card h3 {
      font-size: 1.15rem;
      color: var(--gold-light);
      margin-bottom: 8px;
    }
    .detail-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .highlight-gold {
      color: var(--gold-primary);
      font-weight: 700;
    }

    .countdown-section {
      margin: 40px 0 20px;
    }
    .countdown-title {
      font-size: 1.1rem;
      color: var(--gold-primary);
      margin-bottom: 18px;
    }
    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    .time-slot {
      background: rgba(14, 18, 27, 0.85);
      border: 1px solid var(--border-gold);
      min-width: 72px;
      padding: 12px 8px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .time-slot .number {
      font-family: 'Cinzel Decorative', 'Tajawal', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold-light);
      display: block;
    }
    .time-slot .label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .cta-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 35px;
    }
    .royal-btn {
      background: linear-gradient(135deg, #d4af37 0%, #aa8022 100%);
      color: #0b0d13;
      border: none;
      padding: 14px 30px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
      transition: all 0.3s ease;
      text-decoration: none;
      font-family: 'Tajawal', sans-serif;
    }
    .royal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
      background: linear-gradient(135deg, #f3e5ab 0%, #c9a050 100%);
      color: #000;
    }
    .royal-btn.outline {
      background: transparent;
      color: var(--gold-light);
      border: 1.5px solid var(--gold-primary);
      box-shadow: none;
    }
    .royal-btn.outline:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold-light);
    }

    /* نافذة الـ RSVP المنبثقة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: linear-gradient(145deg, #141a24, #0b0f16);
      border: 1px solid var(--gold-primary);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 35px 25px;
      position: relative;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.4s ease;
      text-align: right;
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }
    .close-modal-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: transparent;
      border: none;
      color: var(--gold-primary);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--gold-light);
    }
    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 12px 14px;
      border-radius: 8px;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--gold-light);
      background: rgba(255, 255, 255, 0.08);
    }
    .radio-pill-group {
      display: flex;
      gap: 10px;
    }
    .radio-pill-group label {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: 0.3s;
    }
    .radio-pill-group input[type="radio"] {
      display: none;
    }
    .radio-pill-group input[type="radio"]:checked + label {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold-primary);
      color: var(--gold-light);
      font-weight: 700;
    }

    .success-alert {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .success-alert i {
      font-size: 3rem;
      color: #4BB543;
      margin-bottom: 15px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ملف الموسيقى (music.mp3) -->
  <audio id="weddingAudio" src="music.mp3" loop preload="auto"></audio>

  <!-- مؤثرات تساقط البتلات الذهبية -->
  <div class="petals-container" id="petals"></div>

  <!-- زر التحكم في الصوت العائم -->
  <button class="floating-audio-btn" id="audioToggle" title="تشغيل / إيقاف الموسيقى">
    <i class="fa-solid fa-volume-xmark"></i>
  </button>

  <!-- ================= المشهد الأول: الظرف الملكي والختم ================= -->
  <div id="envelope-screen">
    <div class="top-royal-banner">
      <div class="monogram-badge">
        <span>م ❦ خ</span>
      </div>
      <div>
        <span class="royal-date-tag">5 . 11 . 2026</span>
      </div>
    </div>

    <!-- الظرف التفاعلي -->
    <div class="envelop
